<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TPRC Group Lists</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-image: url("https://i.imgur.com/BffsTtW.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* The photo lives on its own layer so the seasonal colour filter
       never touches the client names sitting on top of it. */
    #bg-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("https://i.imgur.com/BffsTtW.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      transition: filter 1.2s ease;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 30, 20, 0.55);
      z-index: 0;
    }
    .header {
      position: relative; z-index: 1;
      padding: 18px 30px 14px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      background: rgba(10, 30, 20, 0.5);
    }
    .group-time {
      color: white;
      font-size: 56px;
      font-weight: bold;
      font-style: italic;
      letter-spacing: 2px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.8);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .clock {
      color: white;
      font-size: 32px;
      font-weight: 600;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
    }
    .logo {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: white;
      overflow: hidden;
      padding: 4px;
    }
    .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .jft-bar {
      position: relative; z-index: 1;
      background: rgba(10, 30, 20, 0.4);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      color: white;
      text-align: center;
      padding: 10px 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    .jft-line1 {
      font-size: 16px;
      opacity: 0.85;
      margin-bottom: 3px;
    }
    .jft-quote {
      font-style: italic;
      font-size: 18px;
      margin-bottom: 3px;
    }
    .jft-closing {
      font-size: 16px;
      font-weight: bold;
    }
    .content {
      position: relative; z-index: 1;
      display: flex;
      flex: 1;
      padding: 18px 12px;
      gap: 0;
      overflow: hidden;
    }
    .group-section {
      display: flex;
      flex: 1;
      border-right: 1px solid rgba(255,255,255,0.15);
      padding: 0 10px;
      flex-direction: column;
    }
    .group-section:last-child { border-right: none; }
    .group-cols { display: flex; flex: 1; }
    .col { flex: 1; overflow: hidden; }
    .col + .col {
      padding-left: 6px;
      border-left: 1px solid rgba(255,255,255,0.1);
    }
    .facilitator {
      font-weight: bold;
      font-size: 24px;
      color: #d4ead0;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    .group-note {
      color: #cfe8d8;
      font-size: 15px;
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }
    .client {
      color: white;
      font-size: 26px;
      line-height: 1.55;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    .no-data {
      color: rgba(255,255,255,0.5);
      font-size: 24px;
      text-align: center;
      margin-top: 80px;
      width: 100%;
      position: relative; z-index: 1;
    }
    .debug {
      color: rgba(255,255,255,0.3);
      font-size: 10px;
      position: fixed;
      bottom: 5px;
      left: 5px;
      z-index: 2;
    }

    #screensaver {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: url('https://i.imgur.com/pBaRics.jpeg');
      background-size: cover;
      background-position: center;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    #saver-bg-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('https://i.imgur.com/pBaRics.jpeg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      transition: filter 1.2s ease;
    }
    #screensaver-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: transform 2s ease-in-out;
    }
    #screensaver-logo {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: white;
      padding: 10px;
      object-fit: contain;
    }
    #screensaver-clock {
      font-size: 72px;
      color: white;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="bg-layer"></div>
  <div class="overlay"></div>
  <div class="header">
    <div class="group-time" id="group-time">Loading...</div>
    <div class="header-right">
      <div class="clock" id="header-clock"></div>
      <div class="logo">
        <img src="https://irbrnndhnydywjdmqdvc.supabase.co/storage/v1/object/public/companylogos/logos/4227b196-86b9-47f3-afef-7cf51d50e077.png" alt="TPRC">
      </div>
    </div>
  </div>
  <div class="jft-bar" id="jft-bar" style="display:none;">
    <div class="jft-line1" id="jft-line1"></div>
    <div class="jft-quote" id="jft-quote"></div>
    <div class="jft-closing" id="jft-closing"></div>
  </div>
  <div class="content" id="content"></div>
  <div class="debug" id="debug"></div>

  <div id="screensaver">
    <div id="saver-bg-layer"></div>
    <div id="screensaver-content">
      <img id="screensaver-logo" src="https://irbrnndhnydywjdmqdvc.supabase.co/storage/v1/object/public/companylogos/logos/4227b196-86b9-47f3-afef-7cf51d50e077.png" alt="TPRC">
      <div id="screensaver-clock"></div>
    </div>
  </div>

  <script>
    var API_KEY = 'AIzaSyC5b_s43NZFklE-jL5qt216bzUgfjFDRGo';
    var SHEET_ID = '1fHkHBhXTdKQ5Ovxpe7u9VpOCHrEdv4_VbBX2HKXPXx4';
    var RANGE = 'Sheet1!A:G';
    var JFT_RANGE = 'JFT!A1:F1';
    var MAX_PER_COL = 18;

    var SLIDE_TIMES = {
      1: '8:00 AM',
      2: '9:30 AM',
      3: '11:00 AM',
      4: '1:30 PM'
    };


    // ===================================================================
    // SEASONAL AND HOLIDAY BACKGROUNDS
    // ===================================================================
    // Each theme sets the backdrop and the dark overlay that sits on top
    // of it. The overlay is what keeps the white client names readable,
    // so if you change a backdrop, check the names are still easy to read
    // from across the room before leaving it up.
    //
    // Each theme keeps the real background photo and shifts its colour,
    // so every season still shows an actual photograph rather than a
    // flat wash. `filter` recolours the photo; `overlay` is the dark
    // sheet on top that keeps the white client names readable.
    //
    // To drop in a different photo for a theme, add a bg line to it:
    //     bg: 'url("backgrounds/thanksgiving.jpg")',
    // A theme with no bg line uses the normal background photo.
    //
    // To preview a theme on any date, add ?theme= and its name to the
    // address, e.g.  .../tprc-groups/?theme=thanksgiving
    // Add ?theme=off to force the plain, unfiltered background back.

    var DEFAULT_THEME = {
      name:    'default',
      bg:      'url("https://i.imgur.com/BffsTtW.jpeg")',
      saverBg: 'url("https://i.imgur.com/pBaRics.jpeg")',
      filter:  'none',
      overlay: 'rgba(10, 30, 20, 0.55)'
    };

    // Holidays win over seasons. Dates that move each year (Thanksgiving)
    // are worked out, not hardcoded, so this keeps running after 2026.
    var HOLIDAY_THEMES = [
      {
        name:    'thanksgiving',
        window:  function (y) {
          var t = nthWeekdayOf(y, 10, 4, 4);          // 4th Thursday of November
          return [addDays(t, -3), addDays(t, 1)];     // Monday to Friday of Thanksgiving week
        },
        filter:  'sepia(0.7) saturate(2.5) hue-rotate(-20deg) brightness(1.12) contrast(1.05)',
        overlay: 'rgba(34, 16, 4, 0.46)'
      },
      {
        name:    'winter-holidays',
        window:  function (y) { return [new Date(y, 11, 1), new Date(y, 11, 26)]; },
        filter:  'saturate(1.55) hue-rotate(8deg) brightness(0.98) contrast(1.12)',
        overlay: 'rgba(5, 26, 18, 0.48)'
      },
      {
        name:    'new-year',
        window:  function (y) { return [new Date(y, 11, 27), new Date(y + 1, 0, 2)]; },
        filter:  'saturate(0.7) hue-rotate(172deg) brightness(1.08) contrast(1.05)',
        overlay: 'rgba(8, 14, 34, 0.46)'
      },
      {
        name:    'halloween',
        window:  function (y) { return [new Date(y, 9, 24), new Date(y, 9, 31)]; },
        filter:  'sepia(0.6) saturate(3) hue-rotate(-38deg) brightness(0.95) contrast(1.15)',
        overlay: 'rgba(22, 8, 26, 0.46)'
      }
    ];

    // Every day of the year falls in exactly one of these.
    var SEASON_THEMES = [
      {
        name:    'spring',
        window:  function (y) { return [new Date(y, 2, 1), new Date(y, 4, 31)]; },
        filter:  'saturate(1.9) hue-rotate(12deg) brightness(1.2) contrast(1.02)',
        overlay: 'rgba(6, 28, 14, 0.45)'
      },
      {
        name:    'summer',
        window:  function (y) { return [new Date(y, 5, 1), new Date(y, 7, 31)]; },
        filter:  'saturate(1.7) hue-rotate(-6deg) brightness(1.26)',
        overlay: 'rgba(4, 24, 28, 0.45)'
      },
      {
        name:    'autumn',
        window:  function (y) { return [new Date(y, 8, 1), new Date(y, 10, 30)]; },
        filter:  'sepia(0.5) saturate(2) hue-rotate(-16deg) brightness(1.06)',
        overlay: 'rgba(26, 16, 6, 0.47)'
      },
      {
        name:    'winter',
        window:  function (y) { return [new Date(y, 11, 1), new Date(y + 1, 1, 29)]; },
        filter:  'saturate(0.35) hue-rotate(155deg) brightness(1.25) contrast(0.92)',
        overlay: 'rgba(8, 20, 38, 0.46)'
      }
    ];

    function addDays(d, n) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    }

    // The nth given weekday of a month. weekday: 0 = Sunday, 4 = Thursday.
    function nthWeekdayOf(year, month, weekday, n) {
      var first = new Date(year, month, 1);
      var shift = (weekday - first.getDay() + 7) % 7;
      return new Date(year, month, 1 + shift + (n - 1) * 7);
    }

    function startOfDay(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    // Checks last year, this year and next year so windows that cross
    // New Year's Eve (winter, new-year) match on both sides of the join.
    function matchTheme(list, today) {
      var day = startOfDay(today);
      for (var i = 0; i < list.length; i++) {
        for (var y = today.getFullYear() - 1; y <= today.getFullYear() + 1; y++) {
          var w = list[i].window(y);
          if (day >= startOfDay(w[0]) && day <= startOfDay(w[1])) return list[i];
        }
      }
      return null;
    }

    function themeFor(today) {
      var forced = (location.search.match(/[?&]theme=([\w-]+)/) || [])[1];
      if (forced) {
        if (forced === 'off') return DEFAULT_THEME;
        var all = HOLIDAY_THEMES.concat(SEASON_THEMES);
        for (var i = 0; i < all.length; i++) {
          if (all[i].name === forced) return all[i];
        }
      }
      return matchTheme(HOLIDAY_THEMES, today)
          || matchTheme(SEASON_THEMES, today)
          || DEFAULT_THEME;
    }

    var currentTheme = null;

    function applyTheme() {
      var theme = themeFor(new Date());
      if (currentTheme === theme.name) return;      // nothing to redraw
      currentTheme = theme.name;

      var layer = document.getElementById('bg-layer');
      layer.style.backgroundImage = theme.bg || DEFAULT_THEME.bg;
      layer.style.filter = theme.filter || 'none';

      document.querySelector('.overlay').style.background = theme.overlay;

      var saver = document.getElementById('saver-bg-layer');
      saver.style.backgroundImage = theme.saverBg || DEFAULT_THEME.saverBg;
      saver.style.filter = theme.saverFilter || theme.filter || 'none';
    }

    function getCurrentSlide() {
      var now = new Date();
      var t = (now.getHours() * 100) + now.getMinutes();
      if (t >= 730 && t < 900) return 1;
      if (t >= 900 && t < 1030) return 2;
      if (t >= 1030 && t < 1300) return 3;
      if (t >= 1300) return 4;
      return 1;
    }

    function getDateStr() {
      var now = new Date();
      return (now.getMonth() + 1) + '/' + now.getDate();
    }

    function parseSheetDate(val) {
      if (!val) return '';
      if (typeof val === 'string' && val.indexOf('/') > -1) return val;
      if (typeof val === 'number') {
        var d = new Date(Math.round((val - 25569) * 86400 * 1000));
        return (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
      }
      return String(val);
    }

    function renderGroups(rows) {
      var currentSlide = getCurrentSlide();
      var dateStr = getDateStr();
      var now = new Date();
      var currentTime = (now.getHours() * 100) + now.getMinutes();

      document.getElementById('group-time').textContent = (SLIDE_TIMES[currentSlide] || '') + ' Group';

      var groups = [];
      for (var r = 1; r < rows.length; r++) {
        var row = rows[r];
        if (!row || row.length < 6) continue;
        var rowDate = parseSheetDate(row[0]);
        var rowSlide = parseInt(row[2]);
        if (rowDate === dateStr && rowSlide === currentSlide) {
          groups.push({
            facilitator: String(row[4] || ''),
            clients: String(row[5] || '').split(',').filter(function(c) { return c.trim() !== ''; }),
            note: String(row[6] || '')
          });
        }
      }

      var content = document.getElementById('content');
      content.innerHTML = '';

      if (groups.length === 0) {
        content.innerHTML = '<div class="no-data">No group data available.<br><small style="font-size:14px;">Date: ' + dateStr + ' | Slide: ' + currentSlide + '</small></div>';
      } else {
        for (var g = 0; g < groups.length; g++) {
          var group = groups[g];
          var clients = group.clients;

          var section = document.createElement('div');
          section.className = 'group-section';

          var header = document.createElement('div');
          header.className = 'facilitator';
          header.textContent = group.facilitator;
          section.appendChild(header);

          if (group.note) {
            var noteDiv = document.createElement('div');
            noteDiv.className = 'group-note';
            noteDiv.textContent = group.note;
            section.appendChild(noteDiv);
          }

          var colsWrapper = document.createElement('div');
          colsWrapper.className = 'group-cols';

          var chunkCount = Math.max(1, Math.ceil(clients.length / MAX_PER_COL));

          for (var chunkIdx = 0; chunkIdx < chunkCount; chunkIdx++) {
            var chunk = clients.slice(chunkIdx * MAX_PER_COL, (chunkIdx + 1) * MAX_PER_COL);

            var col = document.createElement('div');
            col.className = 'col';

            for (var c = 0; c < chunk.length; c++) {
              var n = chunk[c].trim();
              if (n) {
                var d = document.createElement('div');
                d.className = 'client';
                d.textContent = n;
                col.appendChild(d);
              }
            }
            colsWrapper.appendChild(col);
          }

          section.appendChild(colsWrapper);
          content.appendChild(section);
        }
      }

      document.getElementById('debug').textContent =
        'Date: ' + dateStr + ' | Slide: ' + currentSlide + ' | Time: ' + currentTime + ' | Groups: ' + groups.length + ' | Updated: ' + now.toLocaleTimeString();
    }

    function renderJFT(rows) {
      var bar = document.getElementById('jft-bar');
      if (!rows || rows.length === 0 || !rows[0]) {
        bar.style.display = 'none';
        return;
      }
      var row = rows[0];
      var date = row[0] || '';
      var title = row[1] || '';
      var page = row[2] || '';
      var quote = row[3] || '';
      var quoteSource = row[4] || '';
      var jftLine = row[5] || '';

      if (!title && !quote && !jftLine) {
        bar.style.display = 'none';
        return;
      }

      document.getElementById('jft-line1').textContent =
        [date, title, page].filter(Boolean).join(' — ');
      document.getElementById('jft-quote').textContent =
        quote ? '"' + quote + '" — ' + quoteSource : '';
      document.getElementById('jft-closing').textContent = jftLine;

      bar.style.display = 'block';
    }

    function fetchData() {
      var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID +
                '/values/' + encodeURIComponent(RANGE) +
                '?key=' + API_KEY;

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.values) {
            renderGroups(data.values);
          } else {
            document.getElementById('content').innerHTML =
              '<div class="no-data">Error loading data</div>';
          }
        })
        .catch(function(err) {
          document.getElementById('content').innerHTML =
            '<div class="no-data">Connection error: ' + err.message + '</div>';
        });
    }

    function fetchJFT() {
      var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID +
                '/values/' + encodeURIComponent(JFT_RANGE) +
                '?key=' + API_KEY;

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          renderJFT(data.values);
        })
        .catch(function(err) {
          document.getElementById('jft-bar').style.display = 'none';
        });
    }

    function isScreensaverTime() {
      var hour = new Date().getHours();
      return hour >= 16 || hour < 7;
    }

    function updateClock() {
      var now = new Date();
      var timeStr = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', hour12: true
      });
      document.getElementById('header-clock').textContent = timeStr;
      document.getElementById('screensaver-clock').textContent = timeStr;
    }

    function shiftPosition() {
      var content = document.getElementById('screensaver-content');
      var maxShift = 20;
      var x = Math.floor(Math.random() * maxShift) - (maxShift / 2);
      var y = Math.floor(Math.random() * maxShift) - (maxShift / 2);
      content.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    }

    function checkDisplayMode() {
      var saver = document.getElementById('screensaver');
      var header = document.querySelector('.header');
      var jftBar = document.getElementById('jft-bar');
      var content = document.getElementById('content');

      if (isScreensaverTime()) {
        saver.style.display = 'flex';
        header.style.display = 'none';
        jftBar.style.display = 'none';
        content.style.display = 'none';
      } else {
        saver.style.display = 'none';
        header.style.display = 'flex';
        content.style.display = 'flex';
      }
    }

    applyTheme();
    fetchData();
    fetchJFT();
    checkDisplayMode();
    updateClock();
    shiftPosition();

    setInterval(fetchData, 120000);
    setInterval(fetchJFT, 120000);

    setInterval(function() {
      fetchData();
      checkDisplayMode();
      applyTheme();
    }, 30000);

    setInterval(updateClock, 1000);
    setInterval(shiftPosition, 5 * 60 * 1000);
  </script>
</body>
</html>
