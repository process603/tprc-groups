<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TPRC Group Lists</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-image: url("https://i.imgur.com/BffsTtW.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 30, 20, 0.55);
      z-index: 0;
    }
    .header {
      position: relative; z-index: 1;
      padding: 18px 30px 14px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      background: rgba(10, 30, 20, 0.5);
    }
    .group-time {
      color: white;
      font-size: 56px;
      font-weight: bold;
      font-style: italic;
      letter-spacing: 2px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.8);
    }
    .logo {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: white;
      overflow: hidden;
      padding: 4px;
    }
    .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .content {
      position: relative; z-index: 1;
      display: flex;
      flex: 1;
      padding: 18px 12px;
      gap: 0;
      overflow: hidden;
    }
    .group-section {
      display: flex;
      flex: 1;
      border-right: 1px solid rgba(255,255,255,0.15);
      padding: 0 10px;
    }
    .group-section:last-child { border-right: none; }
    .col { flex: 1; overflow: hidden; }
    .col + .col {
      padding-left: 6px;
      border-left: 1px solid rgba(255,255,255,0.1);
    }
    .facilitator {
      font-weight: bold;
      font-size: 24px;
      color: #d4ead0;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    .client {
      color: white;
      font-size: 26px;
      line-height: 1.55;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    .no-data {
      color: rgba(255,255,255,0.5);
      font-size: 24px;
      text-align: center;
      margin-top: 80px;
      width: 100%;
      position: relative; z-index: 1;
    }
    .debug {
      color: rgba(255,255,255,0.3);
      font-size: 10px;
      position: fixed;
      bottom: 5px;
      left: 5px;
      z-index: 2;
    }

    /* --- Screensaver --- */
    #screensaver {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: url('https://i.imgur.com/pBaRics.jpeg');
      background-size: cover;
      background-position: center;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    #screensaver-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: transform 2s ease-in-out;
    }
    #screensaver-logo {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: white;
      padding: 10px;
      object-fit: contain;
    }
    #screensaver-clock {
      font-size: 72px;
      color: white;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="header">
    <div class="group-time" id="group-time">Loading...</div>
    <div class="logo">
      <img src="https://irbrnndhnydywjdmqdvc.supabase.co/storage/v1/object/public/companylogos/logos/4227b196-86b9-47f3-afef-7cf51d50e077.png" alt="TPRC">
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="debug" id="debug"></div>

  <div id="screensaver">
    <div id="screensaver-content">
      <img id="screensaver-logo" src="https://irbrnndhnydywjdmqdvc.supabase.co/storage/v1/object/public/companylogos/logos/4227b196-86b9-47f3-afef-7cf51d50e077.png" alt="TPRC">
      <div id="screensaver-clock"></div>
    </div>
  </div>

  <script>
    var API_KEY = 'AIzaSyC5b_s43NZFklE-jL5qt216bzUgfjFDRGo';
    var SHEET_ID = '1fHkHBhXTdKQ5Ovxpe7u9VpOCHrEdv4_VbBX2HKXPXx4';
    var RANGE = 'Sheet1!A:F';
    var MAX_PER_COL = 24;

    var SLIDE_TIMES = {
      1: '8:00 AM',
      2: '9:30 AM',
      3: '11:00 AM',
      4: '1:30 PM'
    };

    function getCurrentSlide() {
      var now = new Date();
      var t = (now.getHours() * 100) + now.getMinutes();
      if (t >= 730 && t < 900) return 1;
      if (t >= 900 && t < 1030) return 2;
      if (t >= 1030 && t < 1300) return 3;
      if (t >= 1300) return 4;
      return 1;
    }

    function getDateStr() {
      var now = new Date();
      return (now.getMonth() + 1) + '/' + now.getDate();
    }

    function parseSheetDate(val) {
      if (!val) return '';
      if (typeof val === 'string' && val.indexOf('/') > -1) return val;
      if (typeof val === 'number') {
        var d = new Date(Math.round((val - 25569) * 86400 * 1000));
        return (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
      }
      return String(val);
    }

    function renderGroups(rows) {
      var currentSlide = getCurrentSlide();
      var dateStr = getDateStr();
      var now = new Date();
      var currentTime = (now.getHours() * 100) + now.getMinutes();

      document.getElementById('group-time').textContent = (SLIDE_TIMES[currentSlide] || '') + ' Group';

      var groups = [];
      for (var r = 1; r < rows.length; r++) {
        var row = rows[r];
        if (!row || row.length < 6) continue;
        var rowDate = parseSheetDate(row[0]);
        var rowSlide = parseInt(row[2]);
        if (rowDate === dateStr && rowSlide === currentSlide) {
          groups.push({
            facilitator: String(row[4] || ''),
            clients: String(row[5] || '').split(',')
          });
        }
      }

      var content = document.getElementById('content');
      content.innerHTML = '';

      if (groups.length === 0) {
        content.innerHTML = '<div class="no-data">No group data available.<br><small style="font-size:14px;">Date: ' + dateStr + ' | Slide: ' + currentSlide + '</small></div>';
      } else {
        for (var g = 0; g < groups.length; g++) {
          var group = groups[g];
          var clients = group.clients;
          var primary = clients.slice(0, MAX_PER_COL);
          var overflow = clients.slice(MAX_PER_COL);

          var section = document.createElement('div');
          section.className = 'group-section';

          var col1 = document.createElement('div');
          col1.className = 'col';
          var facDiv = document.createElement('div');
          facDiv.className = 'facilitator';
          facDiv.textContent = group.facilitator;
          col1.appendChild(facDiv);
          for (var c = 0; c < primary.length; c++) {
            var n = primary[c].trim();
            if (n) {
              var d = document.createElement('div');
              d.className = 'client';
              d.textContent = n;
              col1.appendChild(d);
            }
          }
          section.appendChild(col1);

          if (overflow.length > 0) {
            var col2 = document.createElement('div');
            col2.className = 'col';
            var spacer = document.createElement('div');
            spacer.className = 'facilitator';
            spacer.innerHTML = '&nbsp;';
            col2.appendChild(spacer);
            for (var oc = 0; oc < overflow.length; oc++) {
              var on = overflow[oc].trim();
              if (on) {
                var od = document.createElement('div');
                od.className = 'client';
                od.textContent = on;
                col2.appendChild(od);
              }
            }
            section.appendChild(col2);
          }

          content.appendChild(section);
        }
      }

      document.getElementById('debug').textContent =
        'Date: ' + dateStr + ' | Slide: ' + currentSlide + ' | Time: ' + currentTime + ' | Groups: ' + groups.length + ' | Updated: ' + now.toLocaleTimeString();
    }

    function fetchData() {
      var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID +
                '/values/' + encodeURIComponent(RANGE) +
                '?key=' + API_KEY;

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.values) {
            renderGroups(data.values);
          } else {
            document.getElementById('content').innerHTML =
              '<div class="no-data">Error loading data</div>';
          }
        })
        .catch(function(err) {
          document.getElementById('content').innerHTML =
            '<div class="no-data">Connection error: ' + err.message + '</div>';
        });
    }

    // --- Screensaver logic ---
    function isScreensaverTime() {
      var hour = new Date().getHours();
      return hour >= 16 || hour < 7; // 4pm through 7am
    }

    function updateClock() {
      var clockEl = document.getElementById('screensaver-clock');
      var now = new Date();
      clockEl.textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', hour12: true
      });
    }

    function shiftPosition() {
      var content = document.getElementById('screensaver-content');
      var maxShift = 20; // px
      var x = Math.floor(Math.random() * maxShift) - (maxShift / 2);
      var y = Math.floor(Math.random() * maxShift) - (maxShift / 2);
      content.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    }

    function checkDisplayMode() {
      var saver = document.getElementById('screensaver');
      var header = document.querySelector('.header');
      var content = document.getElementById('content');

      if (isScreensaverTime()) {
        saver.style.display = 'flex';
        header.style.display = 'none';
        content.style.display = 'none';
      } else {
        saver.style.display = 'none';
        header.style.display = 'flex';
        content.style.display = 'flex';
      }
    }

    // Initial load
    fetchData();
    checkDisplayMode();
    updateClock();
    shiftPosition();

    // Refresh data every 2 minutes silently
    setInterval(fetchData, 120000);

    // Check slide + screensaver mode every 30 seconds
    setInterval(function() {
      fetchData();
      checkDisplayMode();
    }, 30000);

    // Clock ticks every second, independent of mode
    setInterval(updateClock, 1000);

    // Reshift screensaver position every 5 min to prevent burn-in
    setInterval(shiftPosition, 5 * 60 * 1000);
  </script>
</body>
</html>
